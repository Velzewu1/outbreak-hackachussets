# Illustrative numbers only. Replace populations with Census ACS and
# disease values with your calibrated fit before drawing conclusions.
disease:
  r0: 2.8
  latent_period: 3.0
  infectious_period: 5.0
  p_hosp: [0.002, 0.01, 0.06]     # ages 0-17, 18-64, 65+
  p_icu: 0.2
  p_death_icu: 0.3
  los_ward: 5.0
  los_icu: 9.0
population:
  patches: [Dorchester, Roxbury, Back Bay]
  ages: ["0-17", "18-64", "65+"]
  counts:
    - [28000, 80000, 15000]
    - [12000, 36000, 6000]
    - [2000, 16000, 3000]
mixing:
  age_contacts:          # relative contacts, rows = who is contacted by age a
    - [7.0, 4.0, 1.0]
    - [2.0, 8.0, 1.5]
    - [1.0, 3.0, 2.5]
  patch_coupling:        # share of time residents of row spend in column
    - [0.80, 0.10, 0.10]
    - [0.10, 0.75, 0.15]
    - [0.05, 0.05, 0.90]
seeding:
  exposed: {Dorchester: 50, Roxbury: 20}
sim:
  start: 2021-12-01
  days: 120
  substeps: 4
  stochastic: false
