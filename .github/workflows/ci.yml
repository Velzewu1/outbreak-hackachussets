name: ci

# Offline CI: install pinned deps, lint, format-check, run tests and the offline
# smoke/verify scripts. No publishing, no deployment, no external network use at
# runtime (the engine runs on committed data/raw snapshots and synthetic fixtures).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest (offline)
        run: python -m pytest -q

      - name: Offline smoke demo
        run: PYTHONPATH=. python scripts/smoke_demo.py

      - name: Frozen walkthrough verification
        run: PYTHONPATH=. python scripts/verify_demo.py
